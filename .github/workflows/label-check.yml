name: label-check

on:
  pull_request:
    # Initial PR checks run in pr.yml after automated dependency labeling.
    types: [labeled, unlabeled]

permissions: {}

jobs:
  label-check:
    runs-on: ubuntu-24.04-2cores-tools-public
    permissions:
      pull-requests: read

    steps:
      - name: Check release label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const allowedLabels = ['major', 'minor', 'patch', 'dependencies', 'skip-changelog'];
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const matchingLabels = labels.map(label => label.name).filter(label => allowedLabels.includes(label));
            if (matchingLabels.length !== 1) {
              core.setFailed(`Expected exactly one of: ${allowedLabels.join(', ')}. Found: ${matchingLabels.join(', ') || 'none'}.`);
            }
