name: label-check

on:
  pull_request:
    # Initial PR checks run in pr.yml after automated dependency labeling.
    types: [labeled, unlabeled]

permissions: {}

jobs:
  label-check:
    runs-on: ubuntu-24.04-2cores-tools-public
    permissions:
      pull-requests: read

    steps:
      - uses: docker://agilepathway/pull-request-label-checker@sha256:253c71fe97d6ae19fff21608f1e10493ec322e7c95d4fed4695b2b8d11f58fb2
        with:
          one_of: major,minor,patch,dependencies,skip-changelog
          repo_token: ${{ secrets.GITHUB_TOKEN }}
